[workspace]
resolver = "2"
members = [
  "apps/keel-deck",
  "apps/keel-audio",
  "apps/keel-light",
  "crates/keel-rpc",
  "crates/keel-store",
  "crates/keel-audio-engine",
  "crates/keel-audio-fx",
  "crates/keel-audio-wave",
  "crates/keel-audio-hal",
  "crates/keel-light-usb",
]
default-members = ["apps/keel-deck", "apps/keel-audio", "apps/keel-light"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Keel"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6"
crossbeam-channel = "0.5"
tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
