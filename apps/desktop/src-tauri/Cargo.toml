[package]
name = "keel"
version = "0.1.0"
description = "Keel — offline cross-platform command deck"
authors = ["Keel"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "keel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
enigo = "0.6.1"
open = "5.4.4"
image = { version = "0.25.10", features = ["png", "jpeg"] }
elgato-streamdeck = "0.13.2"
parking_lot = "0.12.5"
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-shell = "2.5.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
